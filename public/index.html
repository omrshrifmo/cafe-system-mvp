<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كافيه مزاج - تسجيل الدخول</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      user-select: none;
    }
    .pin-btn {
      touch-action: manipulation;
    }
    .pin-btn:active {
      background-color: #334155;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-amber-600 rounded-full flex items-center justify-center text-3xl font-bold text-slate-950 mx-auto mb-3">
        ☕
      </div>
      <h1 class="text-2xl font-bold text-slate-100">كافيه مزاج</h1>
      <p class="text-sm text-slate-400 mt-1">نظام إدارة الكافيه - تسجيل الدخول</p>
    </div>

    <!-- PIN Display -->
    <div class="mb-6">
      <div id="pinDisplay" class="w-full bg-slate-950 border border-slate-700 rounded-lg py-3 px-4 text-center text-3xl tracking-widest font-mono text-amber-400 min-h-[58px] flex items-center justify-center">
        <span id="pinDots" class="text-slate-600 text-sm">أدخل رمز PIN الخاص بك</span>
      </div>
      <div id="errorMsg" class="hidden mt-2 p-2 bg-red-950 border border-red-800 text-red-300 text-xs text-center rounded font-semibold"></div>
    </div>

    <!-- Keypad -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <button onclick="pressNum('1')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">1</button>
      <button onclick="pressNum('2')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">2</button>
      <button onclick="pressNum('3')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">3</button>
      <button onclick="pressNum('4')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">4</button>
      <button onclick="pressNum('5')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">5</button>
      <button onclick="pressNum('6')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">6</button>
      <button onclick="pressNum('7')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">7</button>
      <button onclick="pressNum('8')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">8</button>
      <button onclick="pressNum('9')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">9</button>
      <button onclick="clearPin()" class="pin-btn bg-rose-950 hover:bg-rose-900 text-rose-300 text-sm font-bold py-4 rounded-lg border border-rose-800">مسح ✕</button>
      <button onclick="pressNum('0')" class="pin-btn bg-slate-800 hover:bg-slate-700 text-2xl font-bold py-4 rounded-lg border border-slate-700">0</button>
      <button onclick="submitLogin()" class="pin-btn bg-amber-600 hover:bg-amber-500 text-slate-950 text-xl font-bold py-4 rounded-lg border border-amber-500 flex items-center justify-center">دخول ↵</button>
    </div>
  </div>

  <script>
    let currentPin = "";

    function updateDisplay() {
      const pinDots = document.getElementById("pinDots");
      if (currentPin.length === 0) {
        pinDots.className = "text-slate-600 text-sm";
        pinDots.textContent = "أدخل رمز PIN الخاص بك";
      } else {
        pinDots.className = "text-amber-400 tracking-widest text-3xl font-mono";
        pinDots.textContent = "•".repeat(currentPin.length);
      }
      hideError();
    }

    function pressNum(num) {
      if (currentPin.length < 6) {
        currentPin += num;
        updateDisplay();
      }
    }

    function clearPin() {
      currentPin = "";
      updateDisplay();
    }

    function quickFill(pin) {
      currentPin = pin;
      updateDisplay();
      submitLogin();
    }

    function showError(msg) {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.textContent = msg;
      errorMsg.classList.remove("hidden");
    }

    function hideError() {
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.classList.add("hidden");
    }

    async function submitLogin() {
      if (!currentPin || currentPin.length < 4) {
        showError("رمز PIN يجب أن يتكون من 4 أرقام على الأقل");
        return;
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin_code: currentPin })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          localStorage.setItem('userTools', JSON.stringify(data.tools));
          if (data.activeShift) {
            localStorage.setItem('activeShift', JSON.stringify(data.activeShift));
          } else {
            localStorage.removeItem('activeShift');
          }
          window.location.href = 'portal.html';
        } else {
          showError(data.error || "رمز PIN غير صحيح");
          currentPin = "";
          updateDisplay();
        }
      } catch (err) {
        showError("تعذر الاتصال بالخادم. يرجى المحاولة لاحقاً.");
      }
    }

    // Support keyboard numeric inputs
    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") {
        pressNum(e.key);
      } else if (e.key === "Backspace") {
        currentPin = currentPin.slice(0, -1);
        updateDisplay();
      } else if (e.key === "Enter") {
        submitLogin();
      } else if (e.key === "Escape") {
        clearPin();
      }
    });

    // Auto-redirect only if authoritative active server session exists
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.user) {
            localStorage.setItem('currentUser', JSON.stringify(data.user));
            window.location.replace('/portal.html');
          }
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
