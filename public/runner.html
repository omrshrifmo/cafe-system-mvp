<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كافيه مزاج - شاشة الـ Runner والمتابعة الفورية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/nav.js"></script>
  <script src="/modules/db.js"></script>
  <script src="/modules/realtime.js"></script>
  <script src="/modules/sync.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .flash-green { border: 4px solid #22c55e; background-color: #064e3b; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen max-h-screen flex flex-col overflow-hidden selection:bg-amber-500 selection:text-black">

  <!-- Page Action Header -->
  <div class="shrink-0 bg-slate-900/90 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between shadow-md z-20">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-xl shadow-inner">
        🏃‍♂️
      </div>
      <div>
        <h1 class="text-lg font-black text-white">شاشة الويتر ومتابعة التوصيل (Runner)</h1>
        <p class="text-xs text-slate-400">تنبيهات فورية ومزامنة دقيقة مع المطبخ والبار والشيشة والطاولات</p>
      </div>
    </div>

    <!-- Status -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
        <span class="text-xs text-slate-400">مهام نشطة:</span>
        <span id="alerts-counter" class="text-sm font-extrabold text-emerald-400 font-mono">0</span>
      </div>

      <div id="ws-status" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold">
        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
        <span>جاري الاتصال...</span>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="runner-toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

  <!-- Main Alerts Feed (Internal Scroll) -->
  <main class="max-w-7xl w-full mx-auto p-4 md:p-6 flex-1 min-h-0 overflow-y-auto">
    <div id="alerts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Dynamic Runner Pickup Cards -->
    </div>
    <div id="empty-state" class="text-center py-20 bg-slate-800/40 rounded-xl border border-slate-700/50">
      <span class="text-6xl block mb-3">⚡</span>
      <h2 class="text-2xl font-bold text-slate-400">لا توجد طلبات جاهزة للتسليم حالياً</h2>
      <p class="text-sm text-slate-500 mt-1">ستظهر التنبيهات فوراً عند تجهيز الطلب في البارستا أو الشيشة أو المطبخ</p>
    </div>
  </main>

  <script>
    const alertsGrid = document.getElementById('alerts-grid');
    const emptyState = document.getElementById('empty-state');
    const counterEl = document.getElementById('alerts-counter');
    const activeTasks = new Map();

    const rt = new RealtimeClient({
      venueId: 'V_DEFAULT',
      stationId: 'HALL'
    });

    rt.onStateChange((state) => {
      rt.updateHealthBadge('ws-status');
    });

    async function loadTasks() {
      try {
        const res = await fetch('/api/runner/tasks?venueId=V_DEFAULT', { credentials: 'include' });
        if (res.ok) {
          const data = await res.json();
          activeTasks.clear();
          (data.tasks || []).forEach(t => activeTasks.set(t.id, t));
          renderAlerts();
        }
      } catch (err) {
        console.warn('Could not load runner tasks:', err.message);
      }
    }

    rt.on('RUNNER_TASK_CREATED', (payload) => {
      activeTasks.set(payload.task_id, {
        id: payload.task_id,
        task_type: payload.task_type,
        status: payload.status,
        context: payload.context,
        version: payload.version,
        created_at: payload.created_at
      });
      renderAlerts();
    });

    rt.on('RUNNER_TASK_CLAIMED', (payload) => {
      const task = activeTasks.get(payload.task_id);
      if (task) {
        task.status = 'CLAIMED';
        task.version = payload.version;
        task.owner_id = payload.runner_id;
        renderAlerts();
      }
    });

    rt.on('RUNNER_TASK_COMPLETED', (payload) => {
      activeTasks.delete(payload.task_id);
      renderAlerts();
    });

    function renderAlerts() {
      counterEl.textContent = activeTasks.size;
      if (activeTasks.size === 0) {
        alertsGrid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      let html = '';

      activeTasks.forEach((task) => {
        const ctx = task.context || {};
        const tableTxt = ctx.table_id || (ctx.table_number ? `طاولة ${ctx.table_number}` : 'طلب كاونتر (بدون طاولة)');
        const itemName = ctx.item_name || 'طلب جاهز';
        const isClaimed = task.status === 'CLAIMED';

        html += `
          <div id="alert-card-${task.id}" class="flash-green p-6 rounded-2xl text-center text-white shadow-2xl border-4 transition-all">
            <div class="flex justify-between items-center mb-2 text-emerald-200 text-sm font-bold">
              <span>قسم: ${ctx.station_id || 'المطبخ'}</span>
              <span>مهمة #${task.id.slice(-6)}</span>
            </div>
            <h2 class="text-3xl font-black text-white mb-2">${tableTxt}</h2>
            <p class="text-xl font-bold text-emerald-100 mb-6">${itemName}</p>
            
            <div class="grid grid-cols-2 gap-3">
              <button onclick="completeDelivery('${task.id}', ${task.version || 1})" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-lg py-3 rounded-xl shadow-lg border border-emerald-300">
                ✅ تم التسليم
              </button>
              <button onclick="claimDelivery('${task.id}', ${task.version || 1})" class="${isClaimed ? 'bg-amber-600 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500'} text-white font-bold text-lg py-3 rounded-xl shadow-lg border border-blue-400">
                ${isClaimed ? '✋ محجوز' : '🏃‍♂️ استلام'}
              </button>
            </div>
          </div>
        `;
      });

      alertsGrid.innerHTML = html;
    }

    async function claimDelivery(taskId, version) {
      try {
        const res = await fetch(`/api/runner/tasks/${taskId}/claim`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ expected_version: version })
        });
        if (res.ok) {
          const task = activeTasks.get(taskId);
          if (task) {
            task.status = 'CLAIMED';
            task.version = version + 1;
            renderAlerts();
          }
        }
      } catch (err) {
        console.error('Claim error:', err);
      }
    }

    async function completeDelivery(taskId, version) {
      try {
        const res = await fetch(`/api/runner/tasks/${taskId}/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ expected_version: version })
        });
        if (res.ok) {
          activeTasks.delete(taskId);
          renderAlerts();
        }
      } catch (err) {
        console.error('Complete error:', err);
      }
    }

    // Initialize
    loadTasks();
    rt.connect();
  </script>
</body>
</html>
