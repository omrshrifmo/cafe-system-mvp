# Nginx Reverse Proxy Configuration
# Production deployment for Cafe System ERP
# Replace "cafe.example.com" with your actual domain before deploying.
# Requires: Nginx 1.18+ and Certbot for TLS certificates.
#
# Setup:
#   1. sudo apt install nginx certbot python3-certbot-nginx
#   2. Place this file at /etc/nginx/sites-available/cafe
#   3. sudo ln -s /etc/nginx/sites-available/cafe /etc/nginx/sites-enabled/cafe
#   4. sudo certbot --nginx -d cafe.example.com
#   5. sudo systemctl reload nginx

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=admin_zone:10m rate=10r/m;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name cafe.example.com www.cafe.example.com;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://cafe.example.com$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cafe.example.com;

    # TLS configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/cafe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafe.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Hardened TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    # Remove fingerprinting
    server_tokens off;
    more_clear_headers Server;

    # Max request body size
    client_max_body_size 10M;

    # Connection timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Block dangerous paths at proxy level (defense-in-depth)
    location ~ /\.(git|env|gitignore) { return 404; }
    location ~* \.(sqlite|db|sqlite3|db-wal|db-shm)$ { return 404; }
    location ~* \.map$ { return 404; }
    location ~* \.log$ { return 404; }
    location ^~ /backups/ { return 404; }
    location ^~ /node_modules/ { return 404; }
    location ^~ /src/ { return 404; }
    location ^~ /test/ { return 404; }
    location ^~ /fixtures/ { return 404; }
    location ^~ /scripts/ { return 404; }

    # Public health check (no rate limit for load balancers)
    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth routes (stricter rate limit)
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin routes (strict rate limit)
    location /api/admin/ {
        limit_req zone=admin_zone burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other API and static routes
    location / {
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Access log
    access_log /var/log/nginx/cafe-access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/cafe-error.log warn;
}
